# Grafana for a shrooms mesh (docs/metrics.md): on loopback, published to the
# mesh as a shrooms service; anyone on the mesh may look, nobody may edit
# without the admin password install.sh printed.
[server]
http_addr = 127.0.0.1
http_port = 3000
[auth.anonymous]
enabled = true
org_role = Viewer
[analytics]
reporting_enabled = false
check_for_updates = false
[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/shrooms-traffic.json
