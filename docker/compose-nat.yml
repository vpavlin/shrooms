# M2 topology: three nodes, two of them behind separate NATs.
#
# The M1 compose puts every node on one bridge, so they are directly reachable
# and no hole punching is needed — it exercises discovery, not traversal. Here:
#
#            ┌──────────── public ────────────┐
#            │                                │
#     ┌──────┴──────┐                  ┌──────┴──────┐
#     │  gw-a (NAT) │                  │  gw-b (NAT) │
#     └──────┬──────┘                  └──────┬──────┘
#            │ lan-a                          │ lan-b
#       ┌────┴────┐                      ┌────┴────┐   (docker takes .1
#       │ node-a  │                      │ node-b  │    on each bridge,
#       └─────────┘                      └─────────┘    so gateways use .2)
#
#     node-pub sits directly on `public` with a reachable address.
#
# node-a and node-b can each reach node-pub (outbound through their NAT), but
# reaching each other requires punching — which is the whole point of M2.
#
# The gateways are plain Linux boxes doing MASQUERADE, which gives
# endpoint-independent mapping (the friendly case). Symmetric NAT is a separate
# scenario; see scripts/m2-containers.sh for how to switch a gateway's mapping
# behaviour.

x-node: &node
  image: shrooms:test
  cap_add: [NET_ADMIN]
  devices:
    - /dev/net/tun:/dev/net/tun
  # Nodes behind a NAT must not use docker's default route; the gateway
  # container is their way out. entrypoint-nat.sh rewrites it at startup.
  entrypoint: ["/usr/bin/entrypoint-nat.sh"]

services:
  # Reachable node: no NAT, a stable address on the public segment.
  node-pub:
    image: shrooms:test
    container_name: shrooms-pub
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./run/pub/etc:/etc/shrooms
      - ./run/pub/state:/var/lib/shrooms
    networks:
      public:
        ipv4_address: 10.90.0.10
    command: ["daemon", "-v"]
    # node-pub is reachable from both LANs, so it doubles as the relay. This is
    # the case that matters: two NATed peers talking through a public one, and
    # it does not depend on punching working at all.

  gw-a:
    image: shrooms:test
    container_name: shrooms-gw-a
    cap_add: [NET_ADMIN]
    # Declared rather than left to gateway.sh's own sysctl call: some engines
    # mount /proc/sys read-only, and the gateway then forwards nothing.
    sysctls: {net.ipv4.ip_forward: 1}
    entrypoint: ["/usr/bin/gateway.sh"]
    networks:
      public:
        ipv4_address: 10.90.0.20
      lan-a:
        ipv4_address: 10.91.0.2

  gw-b:
    image: shrooms:test
    container_name: shrooms-gw-b
    cap_add: [NET_ADMIN]
    sysctls: {net.ipv4.ip_forward: 1}
    entrypoint: ["/usr/bin/gateway.sh"]
    networks:
      public:
        ipv4_address: 10.90.0.30
      lan-b:
        ipv4_address: 10.92.0.2

  node-a:
    <<: *node
    container_name: shrooms-a
    depends_on: [gw-a]
    environment:
      NAT_GW: 10.91.0.2
    volumes:
      - ./run/a/etc:/etc/shrooms
      - ./run/a/state:/var/lib/shrooms
    networks:
      lan-a:
        ipv4_address: 10.91.0.100

  node-b:
    <<: *node
    container_name: shrooms-b
    depends_on: [gw-b]
    environment:
      NAT_GW: 10.92.0.2
    volumes:
      - ./run/b/etc:/etc/shrooms
      - ./run/b/state:/var/lib/shrooms
    networks:
      lan-b:
        ipv4_address: 10.92.0.100

networks:
  # `public` carries the reachable node and the outside of both gateways. It
  # still needs upstream internet so nodes can reach the logos.dev fleet.
  public:
    driver: bridge
    ipam:
      config: [{subnet: 10.90.0.0/24}]
  lan-a:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: 10.91.0.0/24}]
  lan-b:
    driver: bridge
    internal: true
    ipam:
      config: [{subnet: 10.92.0.0/24}]
