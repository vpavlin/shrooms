# A single production mesh node.
#
# Uses host networking deliberately. A VPN node must bind its UDP port on the
# machine's real address: behind docker's bridge NAT the reflexive address peers
# observe would be the docker gateway's, the source port would be rewritten, and
# hole punching would be fighting an extra layer of NAT that does not exist in
# reality. Host networking also puts the TUN device in the host's namespace,
# where you can see it with `ip addr` and route to it normally.
#
#   docker compose -f compose-node.yml up -d
#
# Config and state live on the host so the container is disposable and the
# device identity — and its announce sequence number — survive a redeploy.

services:
  shrooms:
    image: shrooms:latest
    container_name: shrooms
    restart: unless-stopped

    network_mode: host

    # NET_ADMIN to create and configure the TUN device. Nothing else is needed;
    # in particular this does not need to be privileged.
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - /etc/shrooms:/etc/shrooms:z
      - /var/lib/shrooms:/var/lib/shrooms:z
      # The admin key, IF this node mints a mesh. It is not needed to run one —
      # a member never holds the authority — but `shrooms init` inside a
      # container without this writes the mesh's admin key to the container's
      # own filesystem, and it is gone the next time the container is recreated.
      #
      # That cannot be recovered. The admin keys are fixed when a mesh is
      # minted, because the mesh id is their hash and the address prefix derives
      # from the id, so a lost key cannot be replaced and the mesh can never
      # admit another device. It happened, on 2026-08-25, to a mesh whose
      # admin_keys were configured on every member and whose private key was on
      # no machine anybody could find.
      #
      # Minting refuses outright now rather than relying on this being
      # uncommented, but the mount is what makes it possible in here at all.
      # Use it with: shrooms admin init --dir /etc/shrooms/admin
      - /etc/shrooms/admin:/etc/shrooms/admin:z
      # The control socket, so `shrooms status` works from the host.
      #
      # :z on every mount, for SELinux. Without it the daemon cannot bind the
      # socket at all — "permission denied" on a path root owns — and the
      # shared form rather than :Z so the host can still reach it.
      - /run/shrooms:/run/shrooms:z

    command: ["daemon", "--socket", "/run/shrooms/shrooms.sock"]

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
