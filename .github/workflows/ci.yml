name: ci

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  # So a run can be forced without an empty commit — useful when checking
  # whether the upstream build has been fixed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Unit tests that need no liblogosdelivery. internal/waku is cgo-bound to the
  # library and is excluded here; it is covered by the build job and by the
  # container integration test.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: CGO_CFLAGS= CGO_LDFLAGS= go vet ./internal/identity/... ./internal/topic/... ./internal/control/... ./internal/wg/... ./internal/disco/... ./internal/relay/...
      - name: test
        run: make test-unit
      - name: uninstaller, against a staged tree
        run: make test-uninstall

  # Everything that links liblogosdelivery, built and tested against the
  # prebuilt library.
  #
  # Without this the cgo-bound packages are only covered by build-from-source,
  # which is continue-on-error — so internal/mesh's tests could fail and nothing
  # would go red. Uses the release tarball rather than a source build precisely
  # so that this job can gate.
  test-cgo:
    name: test (with liblogosdelivery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Fetch liblogosdelivery
        run: make deps-release
      - name: vet
        run: make vet-cgo
      - name: Build every package
        run: make build-all
      - name: Test
        run: make test

      # The reader path, compiled and vetted but not run: it needs a card and a
      # USB reader, which no hosted runner has.
      #
      # No libpcsclite-dev any more. The library is opened at first use rather
      # than linked, so there is nothing to install to COMPILE this — which is
      # the whole point, and worth having CI prove on a machine that has never
      # seen a smartcard.
      - name: Build with reader support
        run: |
          make vet-pcsc
          make shrooms

  # The management surface, end to end, against the real binary.
  #
  # Separate from the unit tests because it is testing the seams between
  # processes rather than any package: a daemon holding state in memory, a CLI
  # writing the file underneath it, an admin key on a different machine, and a
  # config that outlives both. Every bug this was written after lived in one of
  # those seams and was invisible from either side alone.
  #
  # Offline, deliberately. m1/m2/m3 cover the data plane and need the public
  # fleet, which is somebody else's network and takes minutes — this needs to
  # run on every push.
  e2e:
    name: end-to-end (management)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Fetch liblogosdelivery
        run: make deps-release
      - name: Build the binary
        run: make shrooms
      - name: Scenarios
        run: make e2e

  # Two nodes and a mesh that actually comes up, with a local fleet rather than
  # the public one — so this is seconds rather than the four minutes m1 waits on
  # somebody else's network.
  #
  # Gating. It earned it on its first day: it found that the remembered roster
  # never reached the data plane, which every unit test of that feature had
  # passed while testing the half that worked.
  e2e-two-nodes:
    name: end-to-end (two nodes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Fetch liblogosdelivery
        run: make deps-release
      - name: Build the binary
        run: make shrooms
      - name: A tun device
        run: sudo modprobe tun || true; ls -l /dev/net/tun
      - name: Two nodes
        run: sudo --preserve-env=PATH make e2e-two-nodes

  # Publish the container image.
  #
  # Separate from build-from-source, which is continue-on-error and blocked
  # upstream — so the only image build in this workflow was one that never
  # completed. Deploying therefore meant building locally and pushing ~200MB
  # over ssh to every host, which is the slow part of every deploy and of
  # scripts/m3-remote.sh.
  #
  # Built against the release tarball rather than a source build, for the same
  # reason test-cgo is: this job has to be able to gate.
  # One job per architecture, on native runners.
  #
  # Not QEMU. Native runners on both architectures; GitHub's arm64 runners are
  # free for public repositories, which this is.
  #
  # Both halves take the same path: the checksum-pinned release tarball, chosen
  # by architecture. arm64 used to build the library from source, because no
  # arm64 asset had been published — which made the ONLY job that exercised the
  # from-source path the one architecture nobody could test locally. When that
  # path broke it took the manifest with it, for BOTH architectures, because
  # image-manifest needs both arches to have pushed. Now arm64 fetches a
  # checksum-pinned tarball too, like the amd64 image, the tests and the e2e jobs.
  image:
    name: publish image (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Only from the canonical branch and tags. A pull request must not be able
    # to publish an image under this repository's name.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Fetch liblogosdelivery (prebuilt, checksum-pinned)
        run: make deps-release

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lower-cased because ghcr rejects capitals in a repository name, and the
      # owner is whatever GitHub says it is.
      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: make image IMAGE=${{ steps.img.outputs.name }} TAG=${{ github.sha }}-${{ matrix.arch }}

      # Per-architecture tags only. The names anybody actually pulls — :latest,
      # :<sha>, :v1.2 — are manifest lists assembled once both arches exist, in
      # the job below. Pushing a single-arch image to :latest first would give
      # every arm64 host an amd64 image for as long as the other build takes.
      # Retried, because ghcr fails this way and it is not our bug to fix.
      #
      # Observed: "unknown blob", exit 1, on amd64 while arm64 pushed the same
      # base layers successfully seconds earlier. The two architecture jobs push
      # to one repository at once and share layers, so the registry races its
      # own deduplication; the push succeeds on a retry.
      #
      # This is worth a retry rather than a shrug because of what failure costs
      # downstream: image-manifest needs BOTH arches, so one flake skips the
      # manifest entirely and :latest silently keeps pointing at the previous
      # commit. A green run that published nothing is worse than a red one.
      - name: Push
        run: |
          set -u
          img=${{ steps.img.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}
          for attempt in 1 2 3 4 5; do
              if docker push "$img"; then
                  echo "pushed on attempt $attempt"
                  exit 0
              fi
              echo "push failed (attempt $attempt); the registry is often transient here"
              sleep $((attempt * 10))
          done
          echo "::error::push of $img failed five times — not a flake"
          exit 1

      - name: Report
        run: echo "pushed ${{ steps.img.outputs.name }}:${{ github.sha }}-${{ matrix.arch }}"

  # The tags people pull.
  #
  # :latest and :<sha> require BOTH architectures: a manifest list naming an image
  # that does not exist is a pull that fails on exactly the platform it was meant
  # to serve, and a single-arch :latest would hand every arm64 host an amd64 image
  # for as long as the other build takes.
  #
  # But this job must not be *skipped* when one arch fails. Skipped is silent, and
  # silence here is expensive: :latest keeps pointing at an older commit, the run
  # stays green, and the only signal is a job that never appeared. That is how a
  # broken arm64 build froze :latest for a month (2026-08 to 2026-09).
  #
  # So it runs whenever it can, and then:
  #   - :<sha> and :latest move only when both arches are present, unchanged;
  #   - :latest-<arch> moves for whichever arch did succeed, so a host that knows
  #     its own architecture can always pull by name;
  #   - a missing arch is an error, so the run is never quietly green.
  image-manifest:
    name: publish image manifest
    needs: image
    runs-on: ubuntu-latest
    # !cancelled() rather than always(): a cancelled workflow stays cancelled, but
    # a *failed* sibling must not hide this job.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: |
          set -eu
          IMG=${{ steps.img.outputs.name }}
          SHA=${{ github.sha }}

          # Retried for the same reason as the per-arch push above: this writes to
          # the same registry and fails the same transient way, and a manifest that
          # did not land leaves :latest on the previous commit.
          push_manifest() {
            tag=$1; shift
            docker manifest create "$IMG:$tag" "$@"
            for attempt in 1 2 3 4 5; do
              docker manifest push "$IMG:$tag" && return 0
              echo "manifest push $tag failed (attempt $attempt)"
              sleep $((attempt * 10))
            done
            echo "::error::manifest push of $IMG:$tag failed five times"
            return 1
          }

          # Which architectures actually reached the registry. The image job has
          # fail-fast: false, so at most one can be absent.
          present=""
          for arch in amd64 arm64; do
            if docker manifest inspect "$IMG:$SHA-$arch" >/dev/null 2>&1; then
              present="$present $arch"
              echo "present: $arch"
            else
              echo "::warning::no image for $arch at $SHA - that build did not push"
            fi
          done
          present="${present# }"

          case "$(echo "$present" | wc -w)" in
            2)
              push_manifest "$SHA" "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
              # Per-arch aliases, so neither architecture is hostage to the other.
              for arch in amd64 arm64; do
                push_manifest "latest-$arch" "$IMG:$SHA-$arch"
              done
              if [ "${{ github.ref }}" = "refs/heads/master" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
                push_manifest latest "$IMG:$SHA-amd64" "$IMG:$SHA-arm64"
              fi
              case "${{ github.ref }}" in
                refs/tags/v*) push_manifest "${GITHUB_REF_NAME}" "$IMG:$SHA-amd64" "$IMG:$SHA-arm64" ;;
              esac
              ;;
            1)
              # One arch is enough for its own alias and is *not* enough for
              # :latest - see the comment above. The alias keeps a host of the
              # surviving architecture current instead of stuck on an older
              # commit; the error makes the partial state loud rather than green.
              push_manifest "latest-$present" "$IMG:$SHA-$present"
              echo "::error::$SHA has only $present; :latest and :$SHA were NOT moved, so a host on the other architecture is still on the previous :latest."
              exit 1
              ;;
            *)
              echo "::error::neither architecture published an image for $SHA"
              exit 1
              ;;
          esac

      - name: Report
        run: |
          echo "pushed ${{ steps.img.outputs.name }}:${{ github.sha }} for amd64 and arm64"
          echo "arm64 hosts can now: docker pull ${{ steps.img.outputs.name }}:latest"
          echo "NOTE: the package is private until made public in the repo's package settings."

  # The blind relay's image, for both architectures, in one job.
  #
  # Nothing above applies to it. internal/relay links no native library, so
  # there is no liblogosdelivery to fetch or build, no per-architecture cache,
  # and no dependence on the upstream build that has been broken since
  # September. The Dockerfile cross-compiles from the build machine's own
  # architecture (see --platform=$BUILDPLATFORM there), so arm64 costs seconds
  # rather than the hours of emulation that rule it out for the node image.
  #
  # It exists because the deployed relay was four weeks stale: the node image is
  # published on every push and this one was a local-only make target, so it
  # rotted quietly while everything else moved. A relay strangers are invited to
  # run should not be the least maintained thing here.
  #
  # Pushed straight to the multi-arch names rather than assembled from per-arch
  # tags like the node image, because buildx writes one manifest for both in a
  # single command — the reason that dance exists is that the two node builds
  # happen in separate jobs.
  relay-image:
    name: publish relay image
    runs-on: ubuntu-latest
    # Not `== 'push'`: this workflow offers workflow_dispatch precisely "so a
    # run can be forced without an empty commit", and a publish job that skips
    # it makes that useless for the thing most worth forcing — re-publishing a
    # relay after fixing its package permissions, which is how this was found.
    # Pull requests still never publish.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: img
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/$owner/shrooms-relay" >> "$GITHUB_OUTPUT"

      # :latest only on the default branch. A relay is deployed by tag from a
      # manifest that says :latest (deploy/akash/relay.yaml), so moving it from
      # a branch build would redeploy somebody's relay from unreviewed code.
      - name: Tags
        id: tags
        run: |
          IMG=${{ steps.img.outputs.name }}
          t="$IMG:${{ github.sha }}"
          case "${{ github.ref }}" in
            refs/heads/master|refs/heads/main) t="$t,$IMG:latest" ;;
          esac
          case "${{ github.ref }}" in
            refs/tags/v*) t="$t,$IMG:${GITHUB_REF_NAME}" ;;
          esac
          echo "list=$t" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/relay.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: false

      - name: Report
        run: |
          echo "pushed ${{ steps.tags.outputs.list }}"
          echo "redeploy with: docker pull ${{ steps.img.outputs.name }}:latest"

  # Build liblogosdelivery from source in a pinned container, then build
  # logos-vpn against it. The library build is slow, so it is cached by the
  # upstream revision it was built from.
  # Building liblogosdelivery from source, against upstream MASTER rather than
  # the pinned revision everything else uses.
  #
  # Non-gating deliberately: master moves under us, and a red badge for somebody
  # else's breakage teaches you to ignore the badge. But non-gating is not the
  # same as ignored — this job caught its own name being wrong. It was called
  # "blocked upstream" for the NestedPoll error, that error is now patched, and
  # what remained was ours: the public header includes a generated header the
  # Dockerfile never copied out. A job nobody reads because its name explains
  # the failure in advance is worse than no job at all.
  build-from-source:
    name: build from source (upstream master)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve logos-delivery revision
        id: ld
        run: |
          rev=$(git ls-remote https://github.com/logos-messaging/logos-delivery.git refs/heads/master | cut -f1)
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "building against logos-delivery $rev"

      - name: Cache liblogosdelivery
        id: libcache
        uses: actions/cache@v4
        with:
          path: docker/build/lib
          key: liblogosdelivery-${{ steps.ld.outputs.rev }}-${{ hashFiles('docker/build-lib.Dockerfile') }}

      - name: Build liblogosdelivery
        if: steps.libcache.outputs.cache-hit != 'true'
        run: |
          docker build -f docker/build-lib.Dockerfile \
            --build-arg LD_REF=${{ steps.ld.outputs.rev }} \
            --target lib -o docker/build/lib .

      - name: Build every package
        run: make build-all LD_DIR=docker/build/lib

      - name: Build logos-vpn
        run: |
          VERSION=${GITHUB_REF_NAME:-dev} docker build \
            -f docker/build-vpn.Dockerfile \
            --build-arg VERSION=${GITHUB_REF_NAME:-dev} \
            --target dist -o dist .
          cp packaging/shrooms.service dist/

      - name: Report glibc requirement
        run: |
          echo "max glibc symbol required:"
          objdump -T dist/bin/shrooms | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: logos-vpn-linux-amd64
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tar czf logos-vpn-linux-amd64.tar.gz -C dist .
          echo "built logos-vpn-linux-amd64.tar.gz"
        # Attaching to a GitHub Release needs contents:write; add it here and
        # a release step when you are ready to publish.

  # The Basecamp monitoring module: a QML view, packaged as an LGX.
  #
  # Separate from the Go jobs because it shares nothing with them — no cgo, no
  # liblogosdelivery, a different toolchain entirely. It is also the only job
  # that needs Nix, and pinning it here keeps that out of everyone else's path.
  basecamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The QML is checked before it is packaged. It runs offscreen, which is
      # the only way this gets tested at all in CI — and it caught two real
      # bugs (a blocked file:// XHR and a TypeError on a missing field) that
      # reading the file did not.
      # qml-qt6 is the runtime itself, and it is a separate package from
      # qt6-declarative-dev-tools — which ships qmllint, qmlformat, qmlls and
      # nine other qml* tools but not `qml`. That split is why this job spent a
      # week reporting "no qml runtime found" on a machine that had just
      # installed Qt.
      - name: Install Qt for the offscreen check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtqml-workerscript \
            qt6-declarative-dev-tools libqt6svg6 qml-qt6 \
            qml6-module-qtqml qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates qml6-module-qtquick-window
      - name: Check the QML
        run: make basecamp-check

      # Pinned by commit, not by branch. These run in the job that builds the
      # published .lgx, so whoever can move that branch can run code in it.
      # Tag names are equally movable; a SHA is not.
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # v14

      # lgx-portable, not lgx: the plain one can reference paths in the nix
      # store of the machine that built it, which is fine for a dev loop and
      # useless as a download. This is the artifact someone can actually
      # install.
      - name: Build the portable LGX
        run: nix build ./basecamp#lgx-portable --print-build-logs

      - name: Check the package is well formed
        run: |
          lgx=$(find -L result -name '*.lgx' | head -1)
          [ -n "$lgx" ] || { echo "no .lgx was produced"; exit 1; }
          echo "== $lgx =="
          tar tzf "$lgx"
          # A manifest without hashes is a package Basecamp will refuse, and it
          # is much cheaper to catch here than after a download.
          tar xzOf "$lgx" manifest.json | tee /tmp/manifest.json
          python3 - <<'EOF'
          import json, sys
          m = json.load(open('/tmp/manifest.json'))
          for k in ('name', 'version', 'type', 'view', 'hashes'):
              if not m.get(k):
                  sys.exit(f"manifest is missing {k}")
          if m['type'] != 'ui_qml':
              sys.exit(f"unexpected type {m['type']}")
          print(f"ok: {m['name']} {m['version']} ({len(m['hashes'])} hashes)")
          EOF
          cp "$lgx" "logos-vpn-basecamp-$(tar xzOf "$lgx" manifest.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])').lgx"

      - uses: actions/upload-artifact@v4
        with:
          name: logos-vpn-basecamp-lgx
          path: '*.lgx'
